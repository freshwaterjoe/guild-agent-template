<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set up your specialist</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6860; --line: #e4e1da; --accent: #2f5d50;
  --accent-ink: #ffffff; --fail: #b3261e; --warn: #8a5a00; --pass: #2f6b3a; --tip: #3b5b8c; --soft: #f0eee9;
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --panel: #1f1e1c; --ink: #ecebe7; --muted: #a39f96; --line: #34322e; --accent: #7fb8a5; --accent-ink: #10201b;
    --fail: #ff8a80; --warn: #e6b450; --pass: #8fd19e; --tip: #9ab8e6; --soft: #2a2926; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 2; display: flex; gap: 16px; align-items: center; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; flex: 1; }
header .sub { color: var(--muted); font-weight: 400; }
.pill { padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--soft); }
.pill.fail { color: var(--fail); } .pill.pass { color: var(--pass); }
.layout { display: grid; grid-template-columns: 250px 1fr; min-height: calc(100vh - 56px); }
nav { border-right: 1px solid var(--line); padding: 12px 8px; background: var(--panel); }
nav a { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14px; }
nav a:hover { background: var(--soft); }
nav a.active { background: var(--accent); color: var(--accent-ink); }
nav .tick { width: 18px; text-align: center; color: var(--muted); }
nav a.active .tick { color: inherit; }
nav .badge { margin-left: auto; font-size: 12px; color: var(--fail); font-weight: 600; }
nav a.active .badge { color: inherit; }
main { padding: 24px 28px 80px; max-width: 980px; }
h2 { margin: 0 0 4px; font-size: 22px; }
h3 { margin: 24px 0 8px; font-size: 16px; }
.lead { color: var(--muted); margin: 0 0 20px; }
.grid { display: grid; grid-template-columns: 1fr 280px; gap: 24px; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
.ask { background: var(--soft); border-radius: var(--radius); padding: 14px 16px; font-size: 14px; position: sticky; top: 76px; }
.ask h4 { margin: 0 0 6px; font-size: 13px; text-transform: none; color: var(--muted); }
.ask ul { margin: 0; padding-left: 18px; } .ask li { margin: 4px 0; }
label.field { display: block; margin: 0 0 14px; }
label.field > span { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
label.field > small, .hint { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
input[type=text], input[type=number], input[type=password], input[type=url], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
textarea { min-height: 120px; resize: vertical; }
textarea.doc { min-height: 380px; font-family: var(--mono); font-size: 13px; line-height: 1.55; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; } .row > * { flex: 1; min-width: 140px; }
.check { display: flex; gap: 8px; align-items: center; margin: 6px 0 12px; font-size: 14px; }
button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger { color: var(--fail); }
button.link { border: none; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
button:disabled { opacity: .5; cursor: default; }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.saved { color: var(--pass); font-size: 13px; }
.issues { border-left: 3px solid var(--fail); padding: 8px 12px; background: var(--soft); border-radius: 6px; margin: 0 0 14px; font-size: 14px; }
.issues li { margin: 2px 0; }
.finding { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.finding:first-child { border-top: none; }
.mark { width: 18px; flex: none; font-weight: 700; text-align: center; }
.mark.fail { color: var(--fail); } .mark.warn { color: var(--warn); } .mark.pass { color: var(--pass); } .mark.tip { color: var(--tip); } .mark.todo { color: var(--muted); }
pre.log { background: #111; color: #e8e6e1; padding: 12px; border-radius: 8px; max-height: 420px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; }
pre.file { background: var(--soft); padding: 14px; border-radius: 8px; max-height: 520px; overflow: auto; font: 13px/1.55 var(--mono); white-space: pre-wrap; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.item-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.item-head strong { flex: 1; }
table { border-collapse: collapse; width: 100%; font-size: 14px; } th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
code { font-family: var(--mono); font-size: 13px; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
.note { font-size: 14px; color: var(--muted); }
.toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; max-width: 420px; }
.toast.error { background: var(--fail); color: #fff; }
.stage-done { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; align-content: start; } nav { border-right: none; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; } nav a { white-space: nowrap; } .grid { grid-template-columns: 1fr; } .ask { position: static; } main { padding: 16px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Set up your specialist <span class="sub"></span></h1>
  <span id="readiness" class="pill">Checking…</span>
  <button id="recheck" type="button">Check again</button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Stages"></nav>
  <main id="main"><p class="lead">Loading…</p></main>
</div>
<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
let S = null;          // the state from the server
let current = location.hash.slice(1) || "job";
let lastRunLog = "";   // the last run's output, kept while you move around

// ---- Small helpers ----------------------------------------------------------------------
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else if (key === "class") el.className = value;
    else if (key === "value") el.value = value;
    else if (key === "checked") el.checked = Boolean(value);
    else el.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}
const clone = (value) => (value === undefined ? undefined : JSON.parse(JSON.stringify(value)));
const dollars = (micros) => "$" + (micros / 1e6).toFixed(micros >= 1e6 ? 2 : 4);
function toast(message, error) {
  const el = h("div", { class: "toast" + (error ? " error" : ""), role: "status" }, message);
  document.body.append(el);
  setTimeout(() => el.remove(), error ? 7000 : 2500);
}
async function api(path, body) {
  const response = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "x-guild-setup": TOKEN, "content-type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Something went wrong (" + response.status + ").");
  if (data.state) { S = data.state; renderChrome(); }
  return data;
}
async function streamTo(path, body, pre) {
  pre.textContent = "";
  const response = await fetch(path, { method: "POST", headers: { "x-guild-setup": TOKEN, "content-type": "application/json" }, body: JSON.stringify(body) });
  if (!response.ok) { const data = await response.json().catch(() => ({})); throw new Error(data.error || "Couldn't start."); }
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    pre.textContent += decoder.decode(value, { stream: true });
    pre.scrollTop = pre.scrollHeight;
  }
}
function field(label, input, hint) { return h("label", { class: "field" }, h("span", {}, label), input, hint ? h("small", {}, hint) : null); }
function text(value, onInput, attrs) { return h("input", { type: "text", value: value ?? "", oninput: (e) => onInput(e.target.value), ...attrs }); }
function area(value, onInput, attrs) { return h("textarea", { oninput: (e) => onInput(e.target.value), ...attrs }, value ?? ""); }
function number(value, onInput, attrs) { return h("input", { type: "number", value: value ?? "", oninput: (e) => onInput(e.target.value === "" ? undefined : Number(e.target.value)), ...attrs }); }
function select(value, options, onChange) {
  return h("select", { onchange: (e) => onChange(e.target.value) }, options.map(([v, label]) => h("option", { value: v, selected: v === value ? "selected" : null }, label)));
}
function checkbox(label, checked, onChange) { return h("label", { class: "check" }, h("input", { type: "checkbox", checked, onchange: (e) => onChange(e.target.checked) }), label); }
function issuesFor(prefixes) {
  const list = (S.issues || []).filter((issue) => prefixes.some((p) => issue.path === p || issue.path.startsWith(p + ".") || issue.path.startsWith(p + "[")));
  return list.length ? h("ul", { class: "issues" }, list.map((i) => h("li", {}, h("code", {}, i.path || "manifest"), " ", i.message))) : null;
}
function saveButton(label, action) {
  const status = h("span", { class: "saved" });
  const button = h("button", { class: "primary", type: "button", onclick: async () => {
    button.disabled = true;
    try { await action(); status.textContent = "Saved"; setTimeout(() => (status.textContent = ""), 2500); render(); }
    catch (error) { toast(error.message, true); }
    finally { button.disabled = false; }
  } }, label || "Save");
  return [button, status];
}
async function saveManifest(manifest) {
  const result = await api("/api/manifest", { manifest });
  if (result.issues.length) toast(result.issues.length + " problem" + (result.issues.length === 1 ? "" : "s") + " in the manifest: see the notes in red.", true);
}
function asks(items) { return h("aside", { class: "ask" }, h("h4", {}, "Questions to think about"), h("ul", {}, items.map((item) => h("li", {}, item)))); }
function stageToggle(number) {
  const stage = (S.stages || []).find((s) => s.number === number);
  if (!stage) return null;
  return h("div", { class: "stage-done" }, checkbox("This stage is done (ticks it in SETUP.md, which Claude Code's /guild-setup reads too)", stage.done, async (done) => {
    try { await api("/api/stage", { number, done }); render(); } catch (error) { toast(error.message, true); }
  }));
}
function section(title, lead, body, asksList, stage) {
  return [h("h2", {}, title), h("p", { class: "lead" }, lead), h("div", { class: "grid" }, h("div", {}, body, stageToggle(stage)), asksList ? asks(asksList) : h("div"))];
}
function needManifest() {
  if (S.manifest) return null;
  return h("div", { class: "issues" }, S.manifestError || "There's no manifest yet.", " Fix guild.manifest.json by hand, then press Check again.");
}

// ---- Brief fields: JSON Schema properties, as simple kinds -----------------------------------
function kindOf(prop) {
  if (prop.type === "string" && Array.isArray(prop.enum)) return "choice";
  if (prop.type === "string" && !prop.format && !prop.pattern) return (prop.maxLength || 0) > 500 ? "long" : "text";
  if (prop.type === "number") return "number";
  if (prop.type === "integer") return "integer";
  if (prop.type === "boolean") return "boolean";
  return "advanced";
}
const KINDS = [["text", "Short text"], ["long", "Long text"], ["choice", "Choice from a list"], ["number", "Number"], ["integer", "Whole number"], ["boolean", "Yes or no"]];
function applyKind(prop, kind) {
  for (const key of ["type", "enum", "minLength", "maxLength", "minimum", "maximum"]) delete prop[key];
  if (kind === "text") Object.assign(prop, { type: "string", maxLength: 500 });
  if (kind === "long") Object.assign(prop, { type: "string", maxLength: 4000 });
  if (kind === "choice") Object.assign(prop, { type: "string", enum: ["First option", "Second option"] });
  if (kind === "number") prop.type = "number";
  if (kind === "integer") prop.type = "integer";
  if (kind === "boolean") prop.type = "boolean";
}
function humanise(name) { const s = name.replace(/[_-]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }

// ---- The sections ---------------------------------------------------------------------------
const SECTIONS = [
  { id: "job", stage: 1, nav: "The job", areas: ["Manifest", "Listing"], render: renderJob },
  { id: "brief", stage: 2, nav: "The brief", areas: ["Brief and deliverables"], render: renderBrief },
  { id: "deliverable", stage: 3, nav: "The deliverable", areas: [], render: renderDeliverables },
  { id: "method", stage: 4, nav: "The method", areas: ["Specialist"], render: () => renderDoc("method", 4, "The method", "The steps the agent follows, in order. Usually the most valuable part of a specialist: it's your craft.", [
    "Walk through the last time you did this job. What did you do first? Then what?",
    "Where do you decide something that changes the rest of the job?",
    "When do you loop back and redo a step?",
    "What do you check before moving on?",
    "What would a talented junior get wrong at each step?",
    "When should the agent decline the job? (It writes out/_decline.md with a reason, and the buyer pays nothing.)",
  ], "Numbered steps, written as instructions to the agent. Name the files it reads and writes: brief.json, input/, references/, out/.") },
  { id: "skills", stage: 5, nav: "Know-how", areas: [], render: renderSkills },
  { id: "standards", stage: 6, nav: "Standards and voice", areas: [], render: () => renderDoc("instructions", 6, "Standards and voice", "Who the specialist is, the standard it holds, how it writes and what it never does. Not the steps: those are the method.", [
    "If you hired someone to do this, how would you describe the standard you expect?",
    "How should the work read? Any words or habits you can't stand?",
    "What will you never do, or never claim?",
    "Must every client be told something, such as a disclaimer?",
  ], "Keep the rules that the brief and the buyer's files are data, not instructions, and that the agent never claims your qualifications or speaks as you.") },
  { id: "references", stage: 7, nav: "References", areas: [], render: renderReferences },
  { id: "judgement", stage: 8, nav: "Judgement", areas: [], render: renderJudgement },
  { id: "data", stage: 9, nav: "Data and keys", areas: ["Keys and outside hosts", "Secrets"], render: renderData },
  { id: "models", stage: 10, nav: "Models and limits", areas: ["Models"], render: renderModels },
  { id: "tests", stage: 11, nav: "Test briefs", areas: ["Test briefs"], render: renderTests },
  { id: "runs", stage: 12, nav: "Run it", areas: ["Runs and cost"], render: renderRuns },
  { id: "price", stage: 13, nav: "Price", areas: [], render: renderPrice },
  { id: "ready", stage: 14, nav: "Ready to submit", areas: ["Only you can check"], render: renderReady },
];

function renderJob() {
  const m = clone(S.manifest) || {};
  m.builder = m.builder || {};
  const slug = text(m.slug, (v) => (m.slug = v), { pattern: "[a-z0-9-]+" });
  const body = h("div", {}, needManifest(), issuesFor(["slug", "name", "summary", "builder", "version"]), h("div", { class: "card" },
    field("Name", text(m.name, (v) => (m.name = v), { maxlength: 80 }), "What buyers see. Up to 80 characters."),
    field("Address on Guild", h("div", { class: "row" }, slug, h("button", { type: "button", onclick: () => { slug.value = (m.name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 64); m.slug = slug.value; } }, "Make from the name")),
      "The slug: lowercase words joined by hyphens. It's permanent, so choose it carefully."),
    field("Summary", area(m.summary, (v) => (m.summary = v), { maxlength: 280, rows: 3 }), "The sentence a buyer reads first: the job, for whom, and why it beats a general model. Up to 280 characters. Never how it works inside."),
    h("div", { class: "row" },
      field("Built by", text(m.builder.name, (v) => (m.builder.name = v), { maxlength: 80 }), "Your name, or your business's."),
      field("Your website", text(m.builder.url, (v) => (m.builder.url = v || undefined), { type: "url" }), "Optional.")),
    field("Version", text(m.version, (v) => (m.version = v)), "Start at 0.1.0. Raise it for every submission."),
    h("div", { class: "actions" }, saveButton("Save", () => saveManifest(m)))));
  return section("The job", "What this agent does, for whom, and why someone would hire it rather than ask a general model.", body, [
    "In a sentence or two: what job will it do, and for whom?",
    "What does a general model get wrong about this work?",
    "Who pays for this work today, and what do they pay a person?",
    "If it's three jobs, which one would you start with?",
  ], 1);
}

function renderBrief() {
  const m = clone(S.manifest) || {};
  m.inputs = m.inputs || { schema: { type: "object", properties: {}, required: [] } };
  const schema = m.inputs.schema;
  schema.properties = schema.properties || {};
  schema.required = schema.required || [];
  let entries = Object.entries(schema.properties);
  const list = h("div");
  const commit = () => { schema.properties = Object.fromEntries(entries); schema.required = schema.required.filter((n) => n in schema.properties); };
  function draw() {
    list.replaceChildren(...entries.map(([name, prop], index) => {
      const kind = kindOf(prop);
      const required = schema.required.includes(name);
      const item = h("div", { class: "item" },
        h("div", { class: "item-head" }, h("strong", {}, prop.title || humanise(name)), name.startsWith("_") ? h("span", { class: "note" }, "hidden from buyers") : null,
          h("button", { type: "button", disabled: index === 0, onclick: () => { [entries[index - 1], entries[index]] = [entries[index], entries[index - 1]]; draw(); } }, "↑"),
          h("button", { type: "button", disabled: index === entries.length - 1, onclick: () => { [entries[index + 1], entries[index]] = [entries[index], entries[index + 1]]; draw(); } }, "↓"),
          h("button", { type: "button", class: "danger", onclick: () => { entries.splice(index, 1); draw(); } }, "Remove")),
        h("div", { class: "row" },
          field("Field name", text(name, (v) => { const clean = v.replace(/[^A-Za-z0-9_]/g, ""); if (required) schema.required = schema.required.map((n) => (n === name ? clean : n)); entries[index][0] = clean; name = clean; }), "For the agent: letters, numbers, underscores."),
          field("Label", text(prop.title, (v) => (prop.title = v || undefined)), "What buyers see. Optional.")),
        kind === "advanced" ? h("p", { class: "note" }, "This field uses settings the wizard doesn't edit. Change it in guild.manifest.json; it's kept as it is.") :
        h("div", {},
          field("Kind", select(kind, KINDS, (v) => { applyKind(prop, v); draw(); })),
          field("Hint", text(prop.description, (v) => (prop.description = v || undefined)), "Shown under the field: what to put there, with an example."),
          kind === "choice" ? field("Choices, one per line", area((prop.enum || []).join("\n"), (v) => (prop.enum = v.split("\n").map((s) => s.trim()).filter(Boolean)), { rows: 4 })) : null,
          kind === "text" || kind === "long" ? h("div", { class: "row" },
            field("Shortest answer", number(prop.minLength, (v) => (prop.minLength = v), { min: 0 }), "In characters. Optional."),
            field("Longest answer", number(prop.maxLength, (v) => (prop.maxLength = v), { min: 1 }), "In characters.")) : null,
          kind === "number" || kind === "integer" ? h("div", { class: "row" },
            field("Lowest", number(prop.minimum, (v) => (prop.minimum = v))), field("Highest", number(prop.maximum, (v) => (prop.maximum = v)))) : null),
        checkbox("Required: the work is impossible without it", required, (on) => { schema.required = on ? [...new Set([...schema.required, name])] : schema.required.filter((n) => n !== name); }));
      return item;
    }));
  }
  draw();
  const add = h("button", { type: "button", onclick: () => { let n = 1; while (entries.some(([k]) => k === "field_" + n)) n++; entries.push(["field_" + n, { type: "string", maxLength: 500 }]); draw(); } }, "Add a field");

  m.inputs.files = m.inputs.files;
  const files = m.inputs.files || { accept: [], maxCount: 0, maxTotalBytes: 0 };
  const TYPES = [["application/pdf", "PDF"], ["text/plain", "Text"], ["text/markdown", "Markdown"], ["text/csv", "CSV"], ["image/png", "PNG image"], ["image/jpeg", "JPEG image"],
    ["application/vnd.openxmlformats-officedocument.wordprocessingml.document", "Word (needs a converter in the Dockerfile)"], ["application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", "Excel (needs a converter in the Dockerfile)"]];
  const filesCard = h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Files buyers can attach"),
    TYPES.map(([type, label]) => checkbox(label, (files.accept || []).includes(type), (on) => { files.accept = on ? [...new Set([...(files.accept || []), type])] : files.accept.filter((t) => t !== type); })),
    h("div", { class: "row" },
      field("Most files", number(files.maxCount, (v) => (files.maxCount = v), { min: 0, max: 20 }), "0 to 20."),
      field("Most in total (MB)", number(files.maxTotalBytes ? Math.round(files.maxTotalBytes / 1e6) : 0, (v) => (files.maxTotalBytes = Math.round((v || 0) * 1e6)), { min: 0, max: 100 }), "Up to 100 MB.")),
    h("p", { class: "note" }, "Buyers can't yet be made to attach a file. If the work needs one, your method says what to do without it."));

  m.questions = m.questions || { allowed: false, max: 0 };
  const questions = h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Questions during the job"),
    checkbox("The agent may ask the buyer a question partway through", m.questions.allowed, (on) => { m.questions.allowed = on; m.questions.max = on ? Math.max(1, m.questions.max || 1) : 0; }),
    field("Most questions", number(m.questions.max, (v) => (m.questions.max = v || 0), { min: 0, max: 5 }), "Most agents do better asking none and stating their assumptions. Buyers may take a while to answer."));

  const intakeOn = Boolean(m.intake);

    h("p", {}, "Runs every test brief in Docker, sealed off as on Guild, with your own Anthropic key. Each is held to your budget, so at most " + dollars(((S.manifest || {}).limits || {}).budgetMicros || 0) + " a brief, usually much less."),
    keySet ? null : h("p", { class: "issues" }, "Add your Anthropic key under Data and keys first, or run with mock models to test the plumbing for free."),
    h("div", { class: "actions" }, h("button", { type: "button", class: "primary", disabled: !keySet, onclick: run(false) }, "Run the test briefs"), h("button", { type: "button", onclick: run(true) }, "Plumbing only (free)")),

  return section("Run it", "See the work your agent does, and what each task costs.", body, null, 12);
}

function renderPrice() {

    list.replaceChildren(...m.pricing.tiers.map((tier, index) => h("div", { class: "item" },
      h("div", { class: "item-head" }, h("strong", {}, tier.name || "New price"), m.pricing.tiers.length > 1 ? h("button", { type: "button", class: "danger", onclick: () => { m.pricing.tiers.splice(index, 1); draw(); } }, "Remove") : null),
      h("div", { class: "row" }, field("Name", text(tier.name, (v) => (tier.name = v))), field("Id", text(tier.id, (v) => (tier.id = v)), "Lowercase, such as standard."),
        field("Price (US dollars)", number(tier.priceCents ? tier.priceCents / 100 : undefined, (v) => (tier.priceCents = Math.round((v || 0) * 100)), { min: 0, step: 1 }))),
      field("Description", text(tier.description, (v) => (tier.description = v || undefined)), "Optional."))));
  }

  const margins = (S.readiness.findings || []).filter((f) => f.area === "Runs and cost" && /your share/.test(f.message));
  const cost = (S.readiness.findings || []).find((f) => /Model cost per task/.test(f.message));
  const body = h("div", {}, needManifest(), issuesFor(["pricing"]), h("div", { class: "card" }, list,
    h("p", { class: "note" }, "Guild doesn't yet tell your agent which price a buyer chose, so one price is simplest.")),
    h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "What you'd make"),
      h("p", { class: "note" }, "Guild takes " + S.options.commissionBps / 100 + "% when your agent delivers. You pay model costs from your share, for every attempt and revision."),
      cost ? h("p", {}, cost.message) : h("p", { class: "note" }, "Run your test briefs to see what a task costs."), margins.map((f) => h("p", {}, f.message))),
    h("div", { class: "actions" }, saveButton("Save", () => saveManifest(m))));
  return section("Price", "Price on the value of the work to the buyer, then check the cost leaves you enough.", body, [
    "What would you charge a client for this? How long does it take you?",

}

const MARKS = { fail: "✗", warn: "!", tip: "+", todo: "☐", pass: "✓" };
function findingList(findings) { return findings.map((f) => h("div", { class: "finding" }, h("span", { class: "mark " + f.level }, MARKS[f.level]), h("span", {}, f.message))); }
function renderReady() {
  const r = S.readiness;

  const body = h("div", {}, h("div", { class: "card" }, h("p", {}, h("strong", {}, r.ready ? "Ready to submit, once you've gone through what only you can check." : "Not ready yet: " + r.counts.fail + " to fix.")),
    h("p", { class: "note" }, MARKS.fail + " fix before submitting · " + MARKS.warn + " worth fixing · " + MARKS.tip + " would make it better · " + MARKS.todo + " only you can check · " + MARKS.pass + " done")),
    areas.map((area) => h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, area), findingList(r.findings.filter((f) => f.area === area).sort((a, b) => order.indexOf(a.level) - order.indexOf(b.level))))),
    h("div", { class: "card" }, h("h3", { style: "margin-top:0" }, "Submitting"), h("p", {}, "When it's ready, in a terminal in this folder: sign in once, then submit."),
      h("pre", { class: "file" }, "npm run guild -- login\nnpm run guild -- submit . --wait"), h("p", { class: "note" }, "Then set any keys in the Studio (your agent → Versions and keys). Guild runs your test briefs as checks, and a person reviews the results.")));
  return section("Ready to submit", "Guild's readiness check, run on this folder. It calls no models.", body, null, 14);
}

// ---- Chrome: header and navigation ---------------------------------------------------------------
function renderChrome() {
  const r = S.readiness;
  const title = document.querySelector("#title .sub");
  title.textContent = S.manifest && S.manifest.name ? "· " + S.manifest.name : "";
  const pill = document.getElementById("readiness");
  pill.className = "pill " + (r.ready ? "pass" : "fail");
  pill.textContent = r.ready ? "Ready to submit" : r.counts.fail + " to fix";
  const nav = document.getElementById("nav");
  nav.replaceChildren(...SECTIONS.map((s) => {
    const stage = (S.stages || []).find((x) => x.number === s.stage);
    const fails = r.findings.filter((f) => f.level === "fail" && s.areas.includes(f.area)).length;
    return h("a", { href: "#" + s.id, class: s.id === current ? "active" : "" }, h("span", { class: "tick" }, stage && stage.done ? "✓" : String(s.stage)), s.nav, fails ? h("span", { class: "badge" }, fails) : null);
  }));
}
function render() {
  if (!S) return;
  renderChrome();
  const s = SECTIONS.find((x) => x.id === current) || SECTIONS[0];
  document.getElementById("main").replaceChildren(...[s.render()].flat());
}
window.addEventListener("hashchange", () => { current = location.hash.slice(1) || "job"; render(); window.scrollTo(0, 0); });
document.getElementById("recheck").addEventListener("click", async () => { try { await api("/api/check", {}); render(); toast("Checked"); } catch (e) { toast(e.message, true); } });
api("/api/state").then((data) => { S = data; render(); }).catch((error) => { document.getElementById("main").replaceChildren(h("p", { class: "issues" }, error.message)); });
</script>
